# Shared metadata for the qualified libpeios package family. Version 0.5.0-1 is
# the first production ABI baseline; earlier unqualified packages were
# development snapshots and are replaced explicitly by each corresponding
# qualified package.

format = "peipkg"

[package]
version       = "{{version}}-1"
architecture  = "x86_64"
license       = "MIT"
license_class = "free"
homepage      = "https://github.com/peios/libpeios"
