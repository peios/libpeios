# Shared metadata for the qualified libpeios package family. Version 0.5.0-1 is
# the first production ABI baseline.

format = "peipkg"

[package]
version       = "{{version}}-1"
architecture  = "x86_64"
license       = "MIT"
license_class = "free"
homepage      = "https://github.com/peios/libpeios"
