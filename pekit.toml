# libpeios — Peios's stable userspace C ABI library.
#
# One Rust build is split into the runtime shared object, development files,
# static archive, debug symbols, debug sources, and a generated source package.
# Network access is confined to build.vendor; build.main and all tests consume
# only the Cargo.lock-pinned vendor tree and the matching PKM UAPI snapshot.

out_dir = "out"

[source_package]
name = "dev.peios.libpeios-source"

[build.vendor]
command = '''
set -eu

PKM_REV=b5519e6da3ecd4ce854c6299af6844f0a6ce05dd
PKM_SHORT=$(printf %.7s "$PKM_REV")
export CARGO_HOME=/tmp/cargo-libpeios-vendor
mkdir -p "$CARGO_HOME" "$PEKIT_OUT"

grep -F "pkm.git?rev=$PKM_REV#$PKM_REV" Cargo.lock >/dev/null
cargo vendor --locked "$PEKIT_OUT/vendor" > "$PEKIT_OUT/cargo-config.toml"
test -s "$PEKIT_OUT/cargo-config.toml"
test -n "$(find "$PEKIT_OUT/vendor" -mindepth 1 -maxdepth 1 -type d -print -quit)"

# cargo vendor copies only the selected crates. libpeios's public C headers also
# include <pkm/*.h>, which live beside those crates in the same locked PKM Git
# checkout. Preserve that exact checkout's userspace UAPI as a build input.
PKM_ROOT=
for candidate in "$CARGO_HOME"/git/checkouts/pkm-*/*; do
  [ -d "$candidate/uapi/pkm" ] || continue
  [ "$(basename "$candidate")" = "$PKM_SHORT" ] || continue
  [ -z "$PKM_ROOT" ] || { echo "multiple PKM checkouts match $PKM_REV" >&2; exit 1; }
  PKM_ROOT=$candidate
done
test -n "$PKM_ROOT" || { echo "Cargo did not materialize locked PKM checkout $PKM_REV" >&2; exit 1; }
cp -R "$PKM_ROOT/uapi" "$PEKIT_OUT/pkm-uapi"
test -f "$PEKIT_OUT/pkm-uapi/pkm/pkm.h"
'''

[build.vendor.dependencies.peipkg]
"org.git.kernel.dash" = "*"
"dev.peios.peiosutils"             = "*"
"org.gnu.findutils"   = "*"
"org.gnu.grep"        = "*"
"org.rust-lang.rust"  = ">= 1.98.1"

[build.vendor.dependencies.apt]
dash            = "*"
coreutils       = "*"
findutils       = "*"
grep            = "*"
cargo           = "*"
rustc           = "*"
ca-certificates = "*"

[build.main]
needs = ["vendor"]
command = '''
set -eu
set -o pipefail 2>/dev/null || true

SRC=$(pwd -P)
TRIPLET=x86_64-linux-peios
LIBDIR=usr/lib/$TRIPLET
DEBUG_PREFIX=/usr/src/debug/dev.peios.libpeios
DEBUG_ROOT=$PEKIT_OUT$DEBUG_PREFIX
PKM_UAPI=$PEKIT_VENDOR_OUT/pkm-uapi
export CARGO_HOME=$PEKIT_OUT/cargo-home
mkdir -p "$CARGO_HOME"
cp "$PEKIT_VENDOR_OUT/cargo-config.toml" "$CARGO_HOME/config.toml"

VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
test "$VERSION" = "$PEKIT_VERSION"
test -f "$PKM_UAPI/pkm/pkm.h"

# Keep all source references independent of checkout and build-root paths.
export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }--remap-path-prefix=$PEKIT_WORKSPACE_ROOT=$DEBUG_PREFIX/.workspace --remap-path-prefix=$PEKIT_OUT_BASE=$DEBUG_PREFIX/.build --remap-path-prefix=$PEKIT_VENDOR_OUT/vendor=$DEBUG_PREFIX/vendor --remap-path-prefix=$SRC=$DEBUG_PREFIX"
# Control-flow protection (PEI-1155). Peios' libstd is built with LLVM's CET
# instrumentation (org.rust-lang.rust); stable rustc applies it to other
# crates only under -Zcf-protection, so every crate here gets ENDBR landing
# pads and the IBT/SHSTK property survives the link. The bootstrap escape
# hatch is the one the Rust recipe itself uses for the same flag.
export RUSTC_BOOTSTRAP=1
RUSTFLAGS="$RUSTFLAGS -Zcf-protection=full"

# Release validation runs from the gated test target below.
CARGO_PROFILE_RELEASE_DEBUG=2 CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO=off \
  cargo build --release --locked --offline --target-dir "$PEKIT_OUT/target"

# The checked C snapshot must match Rust, the hand-written public headers must
# match that snapshot, and the built DSO must export exactly the checked API.
PKM_UAPI="$PKM_UAPI" PEIOS_LIBRARY="$PEKIT_OUT/target/release/libpeios.so" \
  PEIOS_VERIFY_SNAPSHOT=auto \
  ./tools/verify-abi.sh

mkdir -p "$PEKIT_OUT/$LIBDIR" "$PEKIT_OUT/usr/include/peios"
cp "$PEKIT_OUT/target/release/libpeios.so" "$PEKIT_OUT/$LIBDIR/libpeios.so.0"
ln -s libpeios.so.0 "$PEKIT_OUT/$LIBDIR/libpeios.so"
cp "$PEKIT_OUT/target/release/libpeios.a" "$PEKIT_OUT/$LIBDIR/libpeios.a"
cp include/peios.h "$PEKIT_OUT/usr/include/"
cp include/peios/*.h "$PEKIT_OUT/usr/include/peios/"

mkdir -p "$PEKIT_OUT/$LIBDIR/pkgconfig"
sed -e 's|@prefix@|/usr|g' \
    -e "s|@libdir@|/$LIBDIR|g" \
    -e "s|@version@|$VERSION|g" \
    peios.pc.in > "$PEKIT_OUT/$LIBDIR/pkgconfig/peios.pc"

# Split DWARF from the runtime DSO. The static archive keeps its symbol table
# but not its embedded debug sections.
SO=$PEKIT_OUT/$LIBDIR/libpeios.so.0
LIST=$PEKIT_OUT/.debug-sources
debugedit -b "$SRC" -d "$DEBUG_PREFIX" -l "$LIST" -n "$SO"
BUILD_ID=$(readelf -n "$SO" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
test -n "$BUILD_ID"
FIRST=$(printf %s "$BUILD_ID" | cut -c1-2)
REST=$(printf %s "$BUILD_ID" | cut -c3-)
DEBUG=$PEKIT_OUT/usr/lib/debug/.build-id/$FIRST/$REST.debug
mkdir -p "$(dirname "$DEBUG")"
objcopy --only-keep-debug "$SO" "$DEBUG"
strip --strip-unneeded "$SO"
objcopy --add-gnu-debuglink="$DEBUG" "$SO"
strip --strip-debug "$PEKIT_OUT/$LIBDIR/libpeios.a"

mkdir -p "$DEBUG_ROOT"
tr '\0' '\n' < "$LIST" | LC_ALL=C sort -u | while IFS= read -r rel; do
  [ -n "$rel" ] || continue
  case "$rel" in */) continue ;; esac
  case "$rel" in
    vendor/*) ORIGIN=$PEKIT_VENDOR_OUT/$rel ;;
    *)        ORIGIN=$SRC/$rel ;;
  esac
  [ -f "$ORIGIN" ] || continue
  mkdir -p "$DEBUG_ROOT/$(dirname "$rel")"
  cp "$ORIGIN" "$DEBUG_ROOT/$rel"
done
rm -f "$LIST"
test -n "$(find "$DEBUG_ROOT" -type f -print -quit)"

'''

[test]
needs = ["vendor", "main"]
gate = true
command = '''
set -eu
set -o pipefail 2>/dev/null || true
SRC=$(pwd -P)
TRIPLET=x86_64-linux-peios
LIBDIR=usr/lib/$TRIPLET
PKM_UAPI=$PEKIT_VENDOR_OUT/pkm-uapi
export CARGO_HOME=$PEKIT_OUT/cargo-home
mkdir -p "$CARGO_HOME"
cp "$PEKIT_VENDOR_OUT/cargo-config.toml" "$CARGO_HOME/config.toml"
export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }--remap-path-prefix=$PEKIT_WORKSPACE_ROOT=/usr/src/debug/dev.peios.libpeios/.workspace --remap-path-prefix=$PEKIT_OUT_BASE=/usr/src/debug/dev.peios.libpeios/.build --remap-path-prefix=$PEKIT_VENDOR_OUT/vendor=/usr/src/debug/dev.peios.libpeios/vendor --remap-path-prefix=$SRC=/usr/src/debug/dev.peios.libpeios"
cargo test --release --locked --offline --target-dir "$PEKIT_OUT/target"

# The remaining checks exercise the exact staged package output.
PEKIT_OUT="$PEKIT_MAIN_OUT"
VERSION="$PEKIT_VERSION"
# Prove the staged development surface works for both supported link modes.
PC=$PEKIT_OUT/$LIBDIR/pkgconfig/peios.pc
test "$(PKG_CONFIG_LIBDIR=$(dirname "$PC") pkg-config --modversion peios)" = "$VERSION"
PKG_CONFIG_LIBDIR=$(dirname "$PC") pkg-config --libs --static peios | grep -q -- '-lm'
gcc -I "$PEKIT_OUT/usr/include" -I "$PKM_UAPI" tools/package-smoke.c \
  -L "$PEKIT_OUT/$LIBDIR" -Wl,-rpath-link,"$PEKIT_OUT/$LIBDIR" -lpeios \
  -o "$PEKIT_OUT/smoke-dynamic"
LD_LIBRARY_PATH="$PEKIT_OUT/$LIBDIR" "$PEKIT_OUT/smoke-dynamic"
gcc -I "$PEKIT_OUT/usr/include" -I "$PKM_UAPI" tools/package-smoke.c \
  "$PEKIT_OUT/$LIBDIR/libpeios.a" -lm -lrt -lpthread \
  -o "$PEKIT_OUT/smoke-static"
"$PEKIT_OUT/smoke-static"
rm -f "$PEKIT_OUT/smoke-dynamic" "$PEKIT_OUT/smoke-static"

SO=$PEKIT_OUT/$LIBDIR/libpeios.so.0
BUILD_ID=$(readelf -n "$SO" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
FIRST=$(printf %s "$BUILD_ID" | cut -c1-2)
REST=$(printf %s "$BUILD_ID" | cut -c3-)
DEBUG=$PEKIT_OUT/usr/lib/debug/.build-id/$FIRST/$REST.debug
# ELF policy and reproducibility gates.
readelf -h "$SO" | grep -Eq 'Type:[[:space:]]+DYN'
readelf -dW "$SO" | grep -q 'SONAME.*\[libpeios.so.0\]'
readelf -lW "$SO" | grep -q 'GNU_RELRO'
readelf -lW "$SO" | grep -Eq 'GNU_STACK[[:space:]].*RW[[:space:]]'
readelf -dW "$SO" | grep -q 'BIND_NOW'
! readelf -dW "$SO" | grep -Eq '(RPATH|RUNPATH)'
! readelf -SW "$SO" | grep -q '\.debug_info'
! readelf -SW "$PEKIT_OUT/$LIBDIR/libpeios.a" | grep -q '\.debug_info'
readelf -SW "$DEBUG" | grep -q '\.debug_info'
test "$(readelf -n "$DEBUG" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)" = "$BUILD_ID"
! grep -aFl "$SRC" "$SO" "$PEKIT_OUT/$LIBDIR/libpeios.a" "$DEBUG"
! grep -aFl "$PEKIT_OUT_BASE" "$SO" "$PEKIT_OUT/$LIBDIR/libpeios.a" "$DEBUG"
'''

[test.dependencies.peipkg]
"org.git.kernel.dash"      = "*"
"org.gnu.bash"             = "*"
"dev.peios.peiosutils"                  = "*"
"org.gnu.findutils"        = "*"
"org.gnu.gawk"             = "*"
"org.gnu.grep"             = "*"
"org.gnu.sed"              = "*"
"org.gnu.diffutils"        = "*"
"org.rust-lang.rust"       = ">= 1.98.1"
"org.gnu.gcc-c++"          = ">= 16, < 17"
"org.gnu.binutils"         = "*"
"org.sourceware.debugedit" = "*"
"org.mozilla.cbindgen"     = "= 0.29.2-1"
"org.pkgconf.pkgconf"      = "*"

[test.dependencies.apt]
dash       = "*"
bash       = "*"
coreutils  = "*"
findutils  = "*"
gawk       = "*"
grep       = "*"
sed        = "*"
diffutils  = "*"
cargo      = "*"
rustc      = "*"
gcc        = "*"
"g++"      = "*"
binutils   = "*"
debugedit  = "*"
# Debian stable's generator is older. That rung verifies the committed ABI
# snapshot; the Peios rung above requires and runs the exact 0.29.2 generator.
cbindgen   = "*"
pkgconf    = "*"
[build.main.dependencies.peipkg]
"org.git.kernel.dash"      = "*"
"org.gnu.bash"             = "*"
"dev.peios.peiosutils"                  = "*"
"org.gnu.findutils"        = "*"
"org.gnu.gawk"             = "*"
"org.gnu.grep"             = "*"
"org.gnu.sed"              = "*"
"org.gnu.diffutils"        = "*"
"org.rust-lang.rust"       = ">= 1.98.1"
"org.gnu.gcc-c++"          = ">= 16, < 17"
"org.gnu.binutils"         = "*"
"org.sourceware.debugedit" = "*"
"org.mozilla.cbindgen"     = "= 0.29.2-1"
"org.pkgconf.pkgconf"      = "*"

[build.main.dependencies.apt]
dash       = "*"
bash       = "*"
coreutils  = "*"
findutils  = "*"
gawk       = "*"
grep       = "*"
sed        = "*"
diffutils  = "*"
cargo      = "*"
rustc      = "*"
gcc        = "*"
"g++"      = "*"
binutils   = "*"
debugedit  = "*"
# Debian stable's generator is older. That rung verifies the committed ABI
# snapshot; the Peios rung above requires and runs the exact 0.29.2 generator.
cbindgen   = "*"
pkgconf    = "*"

[clean]
command = "cargo clean"
